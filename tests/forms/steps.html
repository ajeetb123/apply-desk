<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Workday-style multi-step application (test)</title>
<style>
  body { font: 14px -apple-system, sans-serif; max-width: 760px; margin: 20px auto 120px; }
  [data-automation-id^="formField"] { margin: 10px 0; }
  label, legend { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], textarea, button[aria-haspopup] { width: 320px; padding: 6px; font: inherit; text-align: left; }
  [role=listbox] { border: 1px solid #888; background: #fff; list-style: none; margin: 0; padding: 0; width: 330px; position: absolute; max-height: 180px; overflow: auto; z-index: 5; }
  [role=option] { padding: 4px 8px; cursor: pointer; }
  .gone, .step[hidden] { display: none; }
  [data-automation-id="selectedItem"] { display: inline-block; background: #eef; padding: 2px 6px; margin: 2px; }
  .date input { width: 40px; }
  section { border-top: 2px solid #ccc; margin-top: 18px; padding-top: 6px; }
  ol[data-automation-id=progressBar] { display: flex; gap: 12px; list-style: none; padding: 0; font-size: 12px; color: #888; }
  [data-automation-id=progressBarActiveStep] { color: #000; font-weight: 700; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  [data-automation-id=errorBanner] { background: #fee; border: 1px solid #c33; padding: 8px; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: #f6f6f6; padding: 10px; display: flex; gap: 10px; justify-content: center; }
  .loading { position: fixed; inset: 0; background: rgba(255,255,255,.7); }
  dl dt { font-weight: 600; margin-top: 6px; } dl dd { margin: 0; }
</style></head>
<body>
<ol data-automation-id="progressBar"></ol>
<div data-automation-id="errorBanner" hidden><b>Errors Found</b><ul></ul></div>

<div class="step" data-title="Start Your Application">
  <h2>Start Your Application</h2>
  <button type="button" data-automation-id="autofillWithResume">Autofill with Resume</button>
  <button type="button" data-automation-id="applyManually">Apply Manually</button>
  <button type="button">Use My Last Application</button>
</div>

<div class="step" data-title="My Information" hidden>
<div data-automation-id="formField-source"><label id="l-source">How Did You Hear About Us?*</label>
  <div data-automation-id="multiselectInputContainer" data-tree='{"Job Board":["LinkedIn","Indeed","Glassdoor"],"Social Media":["Facebook","Instagram"],"University/College":["Career Fair","Handshake","Professor/Faculty"],"Referral":["Employee Referral"],"Company Careers Site":[],"Other":[]}'><input data-automation-id="searchBox" aria-labelledby="l-source" type="text"></div></div>
<fieldset data-automation-id="formField-previousWorker"><legend><label>Have you previously worked for this organization?*</label></legend>
  <div><input type="radio" name="prev" id="prev-yes" value="true"><label for="prev-yes">Yes</label></div>
  <div><input type="radio" name="prev" id="prev-no" value="false"><label for="prev-no">No</label></div></fieldset>
<div data-automation-id="formField-country"><label id="l-country">Country*</label><button aria-haspopup="listbox" aria-labelledby="l-country" data-options="Canada|Mexico|United States of America|United Kingdom">Select One</button></div>
<div data-automation-id="formField-legalNameSection_firstName"><label for="first">First Name*</label><input id="first" type="text"></div>
<div data-automation-id="formField-legalNameSection_lastName"><label for="last">Last Name*</label><input id="last" type="text"></div>
<div data-automation-id="formField-addressLine1"><label for="addr">Address Line 1*</label><input id="addr" type="text"></div>
<div data-automation-id="formField-city"><label for="city">City*</label><input id="city" type="text"></div>
<div data-automation-id="formField-countryRegion"><label id="l-state">State*</label><button aria-haspopup="listbox" aria-labelledby="l-state" data-options="Texas|Utah|Vermont|Virginia|Washington|West Virginia|Wisconsin">Select One</button></div>
<div data-automation-id="formField-postalCode"><label for="zip">Postal Code*</label><input id="zip" type="text"></div>
<div data-automation-id="formField-phoneType"><label id="l-ptype">Phone Device Type*</label><button aria-haspopup="listbox" aria-labelledby="l-ptype" data-options="Home|Mobile|Work">Select One</button></div>
<div data-automation-id="formField-countryPhoneCode"><label id="l-pcode">Country Phone Code*</label>
  <div data-automation-id="multiselectInputContainer" data-source="Canada (+1)|United Kingdom (+44)|United States of America (+1)|India (+91)"><input data-automation-id="searchBox" aria-labelledby="l-pcode" type="text"></div></div>
<div data-automation-id="formField-phoneNumber"><label for="phone">Phone Number*</label><input id="phone" type="text"></div>
<div data-automation-id="formField-phoneExtension"><label for="ext">Phone Extension</label><input id="ext" type="text"></div>
</div>

<div class="step" data-title="My Experience" hidden>
<section data-automation-id="workExperienceSection"><h3>Work Experience</h3><div class="blocks"></div><button type="button" data-automation-id="Add" data-kind="work">Add</button></section>
<section data-automation-id="educationSection"><h3>Education</h3><div class="blocks"></div><button type="button" data-automation-id="Add" data-kind="edu">Add</button></section>
<section data-automation-id="skillsSection"><h3>Skills</h3>
  <div data-automation-id="formField-skills"><label id="l-skills">Type to Add Skills</label>
  <div data-automation-id="multiselectInputContainer" data-source="Python|SQL|Power BI|Git|Java|JavaScript|React|Node.js|Flask|Pandas"><input data-automation-id="searchBox" aria-labelledby="l-skills" type="text"></div></div></section>
<div data-automation-id="formField-resume"><label for="resume">Resume/CV*</label><input type="file" id="resume" accept=".pdf"></div>
</div>

<div class="step" data-title="Application Questions" hidden>
<div data-automation-id="formField-plans"><label for="plans">What are your plans after graduation?*</label><textarea id="plans"></textarea></div>
<div data-automation-id="formField-relatives"><label for="rel">Please provide the name/s of any relatives currently employed here.*</label><textarea id="rel"></textarea></div>
<div data-automation-id="formField-q1"><label id="q1">Are you legally eligible for employment in the United States?*</label><button aria-haspopup="listbox" aria-labelledby="q1" data-options="Yes|No">Select One</button></div>
<div data-automation-id="formField-q3"><label id="q3">Are you currently or have you ever been employed by the U.S. Government (including military)?*</label><button aria-haspopup="listbox" aria-labelledby="q3" data-options="Yes, I am currently employed by the U.S. Government|Yes, I was formerly employed by the U.S. Government|No, I have never been employed by the U.S. Government">Select One</button></div>
<div data-automation-id="formField-q6"><label id="q6">Do you currently possess an active U.S. Government security clearance?*</label><button aria-haspopup="listbox" aria-labelledby="q6" data-options="Interim Secret|Secret|Top Secret|None">Select One</button></div>
<div data-automation-id="formField-q8"><label id="q8">Are you a non-U.S. government official, or closely related to one?*</label><button aria-haspopup="listbox" aria-labelledby="q8" data-options="Yes|No">Select One</button></div>
<div data-automation-id="formField-noncompete"><label id="q9">Are you bound by any agreement that would restrict your work here?*</label><button aria-haspopup="listbox" aria-labelledby="q9" data-options="Yes|No|N/A">Select One</button></div>
<div data-automation-id="formField-start"><label for="start">Proposed start date*</label><input id="start" type="text" placeholder="MM/DD/YYYY"></div>
</div>

<div class="step" data-title="Voluntary Disclosures" hidden>
<div data-automation-id="formField-gender"><label id="d-gender">Gender*</label><button aria-haspopup="listbox" aria-labelledby="d-gender" data-options="Female|Male|I do not wish to answer">Select One</button></div>
<div data-automation-id="formField-hispanic"><label id="d-hisp">Are you Hispanic or Latino?*</label><button aria-haspopup="listbox" aria-labelledby="d-hisp" data-options="Yes|No|I do not wish to answer">Select One</button></div>
<div data-automation-id="formField-ethnicity"><label id="d-eth">Ethnicity*</label><button aria-haspopup="listbox" aria-labelledby="d-eth" data-options="Asian (Not Hispanic or Latino) (United States of America)|Hispanic or Latino (United States of America)|White (Not Hispanic or Latino) (United States of America)|I do not wish to answer. (United States of America)">Select One</button></div>
<div data-automation-id="formField-veteran"><label id="d-vet">Veteran Status*</label><button aria-haspopup="listbox" aria-labelledby="d-vet" data-options="I am not a protected veteran|I identify as one or more of the classifications of protected veteran|I do not wish to self-identify">Select One</button></div>
<fieldset data-automation-id="formField-agreementCheckbox"><legend>Terms and Conditions*</legend>
  <div><input type="checkbox" id="agree"><label for="agree">Yes, I have read and consent to the terms and conditions.</label></div></fieldset>
</div>

<div class="step" data-title="Self Identify" hidden>
<p>Voluntary Self-Identification of Disability</p>
<div data-automation-id="formField-name"><label for="sname">Name*</label><input id="sname" type="text"></div>
<div data-automation-id="formField-dateSignedOn"><label>Date*</label><div class="date" data-automation-id="dateInputWrapper">
  <input type="text" data-automation-id="dateSectionMonth-input" aria-label="Month" placeholder="MM"><input type="text" data-automation-id="dateSectionDay-input" aria-label="Day" placeholder="DD"><input type="text" data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY"></div></div>
<fieldset data-automation-id="formField-disabilityStatus"><legend>Please check one of the boxes below:*</legend>
  <div><input type="checkbox" id="dis-y"><label for="dis-y">Yes, I have a disability, or have had one in the past</label></div>
  <div><input type="checkbox" id="dis-n"><label for="dis-n">No, I do not have a disability and have not had one in the past</label></div>
  <div><input type="checkbox" id="dis-x"><label for="dis-x">I do not want to answer</label></div></fieldset>
</div>

<div class="step" data-title="Review" hidden><h2>Review</h2><dl id="summary"></dl></div>

<footer><button type="button" data-automation-id="pageFooterBackButton">Back</button><button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button></footer>

<script>
window.submitted = false;
window.staleClicks = 0;
let uid = 0, stepIndex = 0;
const steps = [...document.querySelectorAll('.step')];
const next = document.querySelector('[data-automation-id="bottom-navigation-next-button"]');
const banner = document.querySelector('[data-automation-id=errorBanner]');
function drawProgress() {
  document.querySelector('[data-automation-id=progressBar]').innerHTML = steps.map((s, i) =>
    `<li data-automation-id="${i === stepIndex ? 'progressBarActiveStep' : i < stepIndex ? 'progressBarCompletedStep' : 'progressBarInactiveStep'}">${i === stepIndex ? `<span class="sr">current step ${i + 1} of ${steps.length}</span>` : ''}${s.dataset.title}</li>`).join('');
  steps.forEach((s, i) => s.hidden = i !== stepIndex);
  next.textContent = steps[stepIndex].dataset.title === 'Review' ? 'Submit' : 'Save and Continue';
  next.style.display = stepIndex === 0 ? 'none' : '';
}
function labelOf(el) {
  const field = el.closest('[data-automation-id^="formField"]');
  const legend = field && field.querySelector('legend');
  if (legend) return legend.textContent.trim();
  const label = field && field.querySelector('label');
  return label ? label.textContent.trim() : '';
}
function valueOf(field) {
  const pills = [...field.querySelectorAll('[data-automation-id=selectedItem]')].map(p => p.textContent);
  if (pills.length) return pills.join(', ');
  const button = field.querySelector('button[aria-haspopup]');
  if (button) return button.textContent === 'Select One' ? '' : button.textContent;
  const checks = [...field.querySelectorAll('input[type=checkbox], input[type=radio]')];
  if (checks.length) return checks.filter(c => c.checked).map(c => field.querySelector(`label[for="${c.id}"]`).textContent).join(', ');
  const date = field.querySelector('[data-automation-id=dateInputWrapper]');
  if (date) return [...date.querySelectorAll('input')].map(i => i.value).filter(Boolean).join('/');
  const input = field.querySelector('input:not([type=file]), textarea');
  if (input) return input.value;
  const file = field.querySelector('input[type=file]');
  return file && file.files.length ? file.files[0].name : '';
}
function missing() {
  const out = [];
  for (const field of steps[stepIndex].querySelectorAll('[data-automation-id^="formField"]')) {
    const label = labelOf(field);
    if (!label.endsWith('*') || valueOf(field)) continue;
    out.push(label.replace(/\*$/, ''));
    field.querySelectorAll('input, textarea, button').forEach(c => c.setAttribute('aria-invalid', 'true'));
  }
  return out;
}
next.addEventListener('click', () => {
  if (steps[stepIndex].dataset.title === 'Review') { window.submitted = true; return; }
  const gaps = missing();
  if (gaps.length) {
    banner.hidden = false;
    banner.querySelector('ul').innerHTML = gaps.map(g => `<li data-automation-id="errorMessage">${g}: this field is required</li>`).join('');
    return;
  }
  banner.hidden = true;
  const veil = document.createElement('div'); veil.className = 'loading'; veil.setAttribute('data-automation-id', 'loadingSpinner'); document.body.appendChild(veil);
  setTimeout(() => {
    veil.remove();
    stepIndex += 1;
    if (steps[stepIndex].dataset.title === 'Review') {
      const dl = document.getElementById('summary'); dl.innerHTML = '';
      for (const field of document.querySelectorAll('.step [data-automation-id^="formField"]')) {
        const value = valueOf(field); if (!value) continue;
        const dt = document.createElement('dt'); dt.textContent = labelOf(field).replace(/\*$/, '');
        const dd = document.createElement('dd'); dd.textContent = value;
        dl.append(dt, dd);
      }
    }
    drawProgress();
    scrollTo(0, 0);
  }, 700);
});
document.querySelector('[data-automation-id=applyManually]').addEventListener('click', () => { setTimeout(() => { stepIndex = 1; drawProgress(); }, 400); });
drawProgress();

// Lists that linger after closing, nested prompt categories, delayed search results.
const closeLists = () => document.querySelectorAll('[role=listbox]:not([data-closing])').forEach(list => {
  list.setAttribute('data-closing', '1');
  setTimeout(() => { list.setAttribute('aria-hidden', 'true'); list.classList.add('gone'); }, 350);
});
function place(list, anchor) {
  const r = anchor.getBoundingClientRect();
  list.style.left = (r.left + scrollX) + 'px'; list.style.top = (r.bottom + scrollY) + 'px';
  document.body.appendChild(list);
}
function showOptions(anchor, items, onPick, delay = 180) {
  closeLists();
  setTimeout(() => {
    const list = document.createElement('ul'); list.setAttribute('role', 'listbox');
    if (!items.length) { list.innerHTML = '<li>No Items.</li>'; place(list, anchor); return; }
    for (const item of items) {
      const li = document.createElement('li'); li.setAttribute('role', 'option');
      li.setAttribute('data-automation-label', item.label || item); li.innerHTML = `<div data-automation-id="promptOption">${item.label || item}${item.children ? ' ›' : ''}</div>`;
      li.addEventListener('click', () => {
        if (list.hasAttribute('data-closing')) { staleClicks += 1; return; }
        if (item.children) { showOptions(anchor, item.children, onPick, 120); return; }
        onPick(item.label || item); closeLists();
      });
      list.appendChild(li);
    }
    place(list, anchor);
  }, delay);
}
document.addEventListener('click', e => {
  const button = e.target.closest('button[aria-haspopup=listbox]');
  if (!button) return;
  if (button.getAttribute('aria-expanded') === 'true') { button.setAttribute('aria-expanded', 'false'); closeLists(); return; }
  button.setAttribute('aria-expanded', 'true');
  showOptions(button, button.dataset.options.split('|'), item => { button.textContent = item; button.removeAttribute('aria-invalid'); button.setAttribute('aria-expanded', 'false'); });
});
function prompt(input, term) {
  const box = input.parentElement;
  const pick = item => {
    const pill = document.createElement('div'); pill.setAttribute('data-automation-id', 'selectedItem'); pill.textContent = item; box.insertBefore(pill, input);
    input.value = '';
  };
  if (box.dataset.tree) {
    const tree = JSON.parse(box.dataset.tree);
    if (!term) return showOptions(input, Object.entries(tree).map(([label, kids]) => kids.length ? { label, children: kids } : label), pick, 250);
    const leaves = Object.entries(tree).flatMap(([label, kids]) => kids.length ? kids : [label]);
    return showOptions(input, leaves.filter(l => l.toLowerCase().includes(term.toLowerCase())), pick, 450);
  }
  const words = term.toLowerCase().split(/\s+/).filter(Boolean);
  showOptions(input, box.dataset.source.split('|').filter(s => words.every(w => s.toLowerCase().includes(w))), pick, 450);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLists(); document.querySelectorAll('[aria-expanded=true]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
});
// Like Workday: a search runs when Enter comes back up, and leaving the box clears what was typed.
document.addEventListener('keyup', e => {
  const input = e.target.closest && e.target.closest('[data-automation-id="searchBox"]');
  if (input && e.keyCode === 13) prompt(input, input.value.trim());
});
document.addEventListener('focusout', e => {
  const input = e.target.closest && e.target.closest('[data-automation-id="searchBox"]');
  if (input) input.value = '';
});
document.addEventListener('click', e => {
  const input = e.target.closest && e.target.closest('[data-automation-id="searchBox"]');
  if (input && !input.value) prompt(input, '');
});
function dateField(label, month) {
  return `<div data-automation-id="formField-${label}"><label>${label}*</label><div class="date" data-automation-id="dateInputWrapper">` +
    (month ? `<input type="text" data-automation-id="dateSectionMonth-input" aria-label="Month" placeholder="MM">` : '') +
    `<input type="text" data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY"></div></div>`;
}
document.querySelectorAll('button[data-automation-id=Add]').forEach(add => add.addEventListener('click', () => {
  const blocks = add.parentElement.querySelector('.blocks'); const n = blocks.children.length + 1; uid += 1;
  const block = document.createElement('div'); block.setAttribute('role', 'group');
  block.innerHTML = add.dataset.kind === 'work'
    ? `<h4>Work Experience ${n}</h4><div data-automation-id="formField-jobTitle"><label for="jt${uid}">Job Title*</label><input id="jt${uid}" type="text"></div>
       <div data-automation-id="formField-company"><label for="co${uid}">Company*</label><input id="co${uid}" type="text"></div>
       <div data-automation-id="formField-location"><label for="lo${uid}">Location</label><input id="lo${uid}" type="text"></div>
       <div data-automation-id="formField-currentlyWorkHere"><label for="cw${uid}">I currently work here</label><input id="cw${uid}" type="checkbox"></div>
       ${dateField('From', true)}
       <div data-automation-id="formField-roleDescription"><label for="rd${uid}">Role Description</label><textarea id="rd${uid}"></textarea></div>`
    : `<h4>Education ${n}</h4><div data-automation-id="formField-school"><label id="ls${uid}">School or University*</label>
       <div data-automation-id="multiselectInputContainer" data-source="Virginia Tech Carilion School of Medicine|Virginia State University|Virginia Polytechnic Institute and State University|Texas State University"><input data-automation-id="searchBox" aria-labelledby="ls${uid}" type="text"></div></div>
       <div data-automation-id="formField-degree"><label id="ld${uid}">Degree*</label><button aria-haspopup="listbox" aria-labelledby="ld${uid}" data-options="Associate's Degree|Bachelor of Arts|Bachelor of Science|Master of Science">Select One</button></div>
       <div data-automation-id="formField-field"><label id="lf${uid}">Field of Study</label>
       <div data-automation-id="multiselectInputContainer" data-source="Computer Science and Engineering Technology|Computer Science|Data Science"><input data-automation-id="searchBox" aria-labelledby="lf${uid}" type="text"></div></div>
       <div data-automation-id="formField-gpa"><label for="gpa${uid}">Overall Result (GPA)</label><input id="gpa${uid}" type="text"></div>`;
  setTimeout(() => blocks.appendChild(block), 200);
}));
</script>
</body></html>
