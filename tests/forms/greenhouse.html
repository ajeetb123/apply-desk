<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Greenhouse-style application (test)</title></head>
<body>
<form id="application_form">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" type="text"></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" type="text"></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="job_application[email]" type="text"></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="job_application[phone]" type="text"></div>
  <div class="field"><label for="loc">Location (City)</label><input id="loc" type="text"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input type="file" id="resume" name="resume"></div>
  <div class="field"><label for="cover">Cover Letter</label><input type="file" id="cover" name="cover_letter"></div>
  <div class="field"><label for="li">LinkedIn Profile</label><input id="li" type="text"></div>
  <div class="field"><label for="gh">GitHub URL</label><input id="gh" type="text"></div>
  <div class="field"><label for="site">Website</label><input id="site" type="text"></div>
  <div class="field"><label for="auth">Are you legally authorized to work in the United States? *</label><select id="auth"><option value="">--</option><option>Yes</option><option>No</option></select></div>
  <div class="field"><label for="spon">Will you now or in the future require sponsorship? *</label><select id="spon"><option value="">--</option><option>Yes</option><option>No</option></select></div>
  <div class="field"><label for="hear">How did you hear about this job?</label><select id="hear"><option value="">--</option><option>LinkedIn</option><option>Career Fair</option><option>University Career Center</option><option>Other</option></select></div>
  <div class="field"><label for="school">School</label><input id="school" type="text"></div>
  <div class="field"><label for="deg">Degree</label><select id="deg"><option value="">--</option><option>High School</option><option>Bachelor's Degree</option><option>Master's Degree</option></select></div>
  <div class="field"><label for="gdate">Expected graduation date</label><input id="gdate" type="month"></div>
  <div class="field"><label for="clr">Security clearance level</label><select id="clr"><option value="">--</option><option>None</option><option>Secret</option><option>Top Secret</option></select></div>
  <div class="field"><label for="sdate">Earliest start date</label><input id="sdate" type="date"></div>
  <div class="field"><label for="gpa">GPA</label><input id="gpa" type="text"></div>
  <div class="field"><label><input type="checkbox" id="certify"> I certify that the information provided is accurate.</label></div>
  <div class="field"><label for="gender">Gender</label><select id="gender"><option value="">--</option><option>Male</option><option>Female</option></select></div>
  <div class="field"><label for="race">Race / Ethnicity</label><select id="race"><option value="">--</option><option>Asian</option></select></div>
  <div class="field"><label for="why">Why do you want to work here?</label><textarea id="why"></textarea></div>
</form>
</body></html>
